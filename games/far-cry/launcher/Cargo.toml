[package]
name = "farcrycoop-launcher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "FarCryCoopLauncher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
